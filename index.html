function renderCrawlCard(track, status){
  const el = $('#crawlCard'); if (!el) return;
  const id = String(track.trackId);
  const crawled = hasAudio(track);
  const cached  = isCached(id);
  const dl      = DL.get(id);

  if (cached){
    el.innerHTML = `<div class="crawl-card ready">
      <i class="bi bi-cloud-check-fill text-success" style="font-size:1.5rem"></i>
      <div class="cc-body">
        <div class="cc-title">Saved offline</div>
        <div class="cc-sub">Ready to play without internet</div>
      </div>
      <button class="pill-btn danger" onclick="removeCached('${esc(id)}')">
        <i class="bi bi-trash3"></i> Remove
      </button>
    </div>`;
    return;
  }

  if (dl && ['queued','crawling','saving'].includes(dl.status)){
    const isSaving = dl.status === 'saving';
    const label = dl.status === 'queued' ? 'Queued' : isSaving ? 'Saving to offline' : 'Crawling audio';
    const pct = dl.percent || 0;
    el.innerHTML = `<div class="crawl-card pending" style="flex-direction:column;align-items:stretch">
      <div class="d-flex align-items-center gap-2">
        <span class="spinner-border spinner-border-sm text-info"></span>
        <span class="cc-title flex-grow-1">${label}…</span>
        <span class="fw-bold text-info" style="font-size:.8rem">${pct}%</span>
      </div>
      <div class="progress mt-2"><div class="progress-bar bg-info" style="width:${pct}%"></div></div>
      ${isSaving && dl.totalBytes ? `<div class="cc-sub">${fmtSize(dl.bytes)} / ${fmtSize(dl.totalBytes)}</div>` : ''}
      <div class="cc-sub">Follow live in the Offline tab.</div>
    </div>`;
    return;
  }

  if (dl && dl.status === 'failed'){
    el.innerHTML = `<div class="crawl-card fail">
      <i class="bi bi-x-circle-fill text-danger" style="font-size:1.5rem"></i>
      <div class="cc-body">
        <div class="cc-title">Download failed</div>
        ${dl.error ? `<div class="cc-sub text-truncate">${esc(dl.error)}</div>` : ''}
      </div>
      <button class="pill-btn danger" onclick="DL.retry('${esc(id)}')">
        <i class="bi bi-arrow-repeat"></i> Retry
      </button>
    </div>`;
    return;
  }

  if (dl && dl.status === 'ready'){
    el.innerHTML = `<div class="crawl-card ready">
      <i class="bi bi-cloud-arrow-down-fill text-success" style="font-size:1.5rem"></i>
      <div class="cc-body">
        <div class="cc-title">Audio ready</div>
        <div class="cc-sub">Save to listen without internet</div>
      </div>
      <button class="pill-btn success" onclick="DL.saveNow('${esc(id)}')">
        <i class="bi bi-download"></i> Save
      </button>
    </div>`;
    return;
  }

  if (crawled){
    el.innerHTML = `<div class="crawl-card ready">
      <i class="bi bi-check-circle-fill text-success" style="font-size:1.5rem"></i>
      <div class="cc-body">
        <div class="cc-title">Audio ready</div>
        <div class="cc-sub">Save to listen without internet</div>
      </div>
      <button class="pill-btn success" onclick="saveTrack('${esc(id)}', this)">
        <i class="bi bi-download"></i> Save
      </button>
    </div>`;
    return;
  }

  el.innerHTML = `<div class="crawl-card idle">
    <i class="bi bi-cloud-arrow-down text-primary" style="font-size:1.7rem"></i>
    <div class="cc-body">
      <div class="cc-title">No audio available</div>
      <div class="cc-sub">Fetch the audio from the server</div>
    </div>
    <div class="d-flex flex-column gap-1">
      <button class="pill-btn primary" onclick="startCrawl('${esc(id)}', this)">
        <i class="bi bi-cloud-arrow-down"></i> Crawl
      </button>
      <button class="pill-btn sm" onclick="startCrawl('${esc(id)}', this, true)">
        <i class="bi bi-cloud-download"></i> + Save
      </button>
    </div>
  </div>`;
}

function startTrackPoller(trackId){
  stopTrackPoller();
  const tid = String(trackId);
  const tick = async () => {
    const cur = location.hash.startsWith('#/track/')
      ? location.hash.split('?')[0].split('/')[2] : null;
    if (String(cur) !== tid){ stopTrackPoller(); return; }

    const dl = DL.get(tid);
    // Use the same "not found = completed" semantics only when the DL manager
    // is already tracking this item (i.e. we know it was queued).
    const status = await apiCrawlStatus(tid, { assumeCompletedIfMissing: !!dl });

    if (!status || status.download_status === 'completed' || (dl && dl.status === 'saving')){
      try {
        const fresh = await apiLookup(tid, 'song');
        const it = fresh.find(x => itemType(x) === 'track') || fresh[0];
        if (it && hasAudio(it)){
          cacheItems([it]);
          if (location.hash.startsWith('#/track/')){
            renderTrackPage(it);
            refreshLikes();
          }
        }
      } catch {}
      if (dl && ['queued','crawling','saving'].includes(dl.status)) return;
      stopTrackPoller();
      return;
    }

    const cached = getCached('track', tid);
    if (cached) renderCrawlCard(cached, status);

    if (['failed','stopped'].includes(status?.download_status)) stopTrackPoller();
  };
  tick();
  trackPoller = setInterval(tick, POLL_MS);
}

async function loadLyrics(trackId){
  const body = $('#lyricsBody'); if (!body) return;
  try {
    const r = await apiLyrics(trackId);
    let text = '';
    const L = r?.lyrics || r?.result || r?.data;
    if (typeof L === 'string') text = L;
    else if (L){
      if (typeof L.plain === 'string')       text = L.plain;
      else if (typeof L.lyrics === 'string') text = L.lyrics;
      else if (typeof L.text === 'string')   text = L.text;
      else if (typeof L.unsynced === 'string') text = L.unsynced;
      else if (Array.isArray(L))             text = L.map(l => l.text || l.line || l.content || '').join('\n');
      else if (Array.isArray(L.lines))       text = L.lines.map(l => l.text || l.line || '').join('\n');
    }
    if (!text && typeof r?.plain === 'string') text = r.plain;
    if (!text && typeof r?.text === 'string')  text = r.text;

    if (!text){
      body.innerHTML = `<div class="text-secondary" style="font-size:.82rem">No lyrics available for this track.</div>`;
      return;
    }
    text = String(text).replace(/\[\d+:\d+(?:\.\d+)?\]\s*/g, '').trim();
    body.innerHTML = esc(text);
  } catch {
    body.innerHTML = `<div class="text-secondary" style="font-size:.82rem">Could not load lyrics.</div>`;
  }
}
function copyLyrics(){
  const t = $('#lyricsBody')?.innerText || '';
  if (!t) return;
  const done = () => toast('Lyrics copied');
  if (navigator.clipboard?.writeText){
    navigator.clipboard.writeText(t).then(done).catch(() => toast('Copy failed', 'danger'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch { toast('Copy failed', 'danger'); }
    ta.remove();
  }
}

function likesToItems(){

    trackId: l.trackId, trackName: l.trackName,
    artistName: l.artistName, artistId: l.artistId,

function viewLikes(){

  let html = libraryTabs('likes');
  if (!likes.length){
    html += emptyState('heart', 'No liked songs yet', 'Tap the heart on any track to save it here.');
  } else {
    const items = likesToItems();
    const ids = items.map(x => x.trackId).join(',');
    html += `<div class="d-flex align-items-center px-3 pt-4 pb-2">
      <div class="flex-grow-1 fw-bold">${likes.length} liked song${likes.length !== 1 ? 's' : ''}</div>
      <button class="pill-btn success" onclick="playIds('${esc(ids)}')"><i class="bi bi-play-fill"></i> Play all</button>
    </div>`;
    html += items.map(t => trackRow(t)).join('');
  }
  MAIN().innerHTML = html;
}

function viewPlaylists(){
  const pls = getPlaylists();
  let html = libraryTabs('playlists');
  html += `<div class="d-flex align-items-center px-3 pt-4 pb-2">
    <div class="flex-grow-1 fw-bold">Your playlists</div>
    <button class="pill-btn primary" onclick="newPlaylistPrompt()"><i class="bi bi-plus-lg"></i> New</button>
  </div>`;
  if (!pls.length){
    html += emptyState('music-note-list', 'No playlists yet', 'Create one to organize your music.');
  } else {
    html += pls.map(pl => {
      const cover = pl.tracks.find(t => t.artworkUrl)?.artworkUrl || '';
      return `<a class="row-item" href="#/library/playlists/${esc(pl.id)}">
        ${cover ? `<img class="row-art" src="${esc(cover)}" alt="">`
                : `<div class="row-art row-art-ph"><i class="bi bi-music-note-list"></i></div>`}
        <div class="row-info">
          <div class="min-w-0 flex-grow-1">
            <div class="row-title text-truncate">${esc(pl.name)}</div>
            <div class="row-sub text-truncate">${pl.tracks.length} track${pl.tracks.length !== 1 ? 's' : ''}</div>
          </div>
          <i class="bi bi-chevron-right text-secondary"></i>
        </div>
      </a>`;
    }).join('');
  }
  MAIN().innerHTML = html;
}

function renderPlaylistDetail(plId){
  const pl = getPlaylists().find(p => p.id === plId);
  if (!pl){ MAIN().innerHTML = emptyState('music-note-list', 'Playlist not found'); return; }
  const items = playlistToItems(plId);
  const ids = items.map(x => String(x.trackId)).join(',');

  let html = `<div class="pb-4">`;
  html += backBtn('#/library/playlists');
  html += `<div class="px-3 pt-1">
    <div style="font-size:1.35rem;font-weight:800;letter-spacing:-.02em" class="text-truncate">${esc(pl.name)}</div>
    <div class="text-secondary" style="font-size:.8rem">${pl.tracks.length} track${pl.tracks.length !== 1 ? 's' : ''}</div>
  </div>`;
  html += `<div class="action-bar" style="justify-content:flex-start;padding-left:16px">
    ${items.length ? `<button class="pill-btn success" onclick="playIds('${esc(ids)}')"><i class="bi bi-play-fill"></i> Play</button>` : ''}
    <button class="icon-btn" style="background:rgba(var(--bs-body-color-rgb),.09)" onclick="renamePlaylist('${esc(plId)}')" aria-label="Rename"><i class="bi bi-pencil"></i></button>
    <button class="icon-btn" style="background:rgba(var(--bs-body-color-rgb),.09)" onclick="deletePlaylist('${esc(plId)}')" aria-label="Delete"><i class="bi bi-trash3"></i></button>
  </div>`;
  html += items.length
    ? items.map(t => trackRow(t, { playlistId: plId })).join('')
    : emptyState('music-note', 'This playlist is empty', 'Add songs from the ⋮ menu.');
  html += `</div>`;
  MAIN().innerHTML = html;
}

function playlistToItems(plId){
  const pl = getPlaylists().find(p => p.id === plId);
  if (!pl) return [];
  return pl.tracks.map(l => ({
    wrapperType:'track',
    trackId: l.trackId, trackName: l.trackName,
    artistName: l.artistName, artistId: l.artistId,
    collectionName: l.collectionName, collectionId: l.collectionId,
    attachments: {
      artworkUrls: l.artworkUrl ? [{ url: l.artworkUrl }] : [],
      audioUrls: isCached(l.trackId) ? [{ url:'local', quality:'320' }] : []
    }
  }));
}

async function renamePlaylist(id){
  const pl = getPlaylists().find(p => p.id === id); if (!pl) return;
  const name = await askText('Rename playlist', pl.name, 'Playlist name');
  if (!name) return;
  const all = getPlaylists();
  const t = all.find(p => p.id === id); if (!t) return;
  t.name = name; savePlaylists(all);
  if (location.hash === `#/library/playlists/${id}`) renderPlaylistDetail(id);
  else viewPlaylists();
  toast('Renamed');
}
async function deletePlaylist(id){
  const pl = getPlaylists().find(p => p.id === id); if (!pl) return;
  const ok = await askConfirm('Delete playlist?', `"${pl.name}" and its contents will be removed.`, 'Delete');
  if (!ok) return;
  savePlaylists(getPlaylists().filter(p => p.id !== id));
  toast('Playlist deleted');
  go('#/library/playlists');
}

/* ══════════════════════════════════════════════════════════════
   23 · DOWNLOADS VIEW
   ══════════════════════════════════════════════════════════════ */
let dlUnsubscribe = null;

function renderDownloads(){
  MAIN().innerHTML = libraryTabs('downloads')
    + `<div id="dlContent"><div class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></div></div>`;

  // Re-render on DL changes while this view is mounted.
  if (dlUnsubscribe) dlUnsubscribe();
  dlUnsubscribe = DL.onChange(() => {
    if (location.hash.startsWith('#/library/downloads')) updateDlLists();
  });

  updateDlLists();
}

async function updateDlLists(){
  const wrap = $('#dlContent');
  if (!wrap) return;

  const active = DL.active();
  const ready  = DL.ready();
  const failed = DL.failed();
  const all = await cacheAll();
  const totalSize = all.reduce((s,e) => s + (e.size || 0), 0);

  let html = '';

  if (active.length){
    html += `<h6 class="sec-title tight">Downloading · ${active.length}</h6>`;
    html += active.map(it => dlRowHtml(it)).join('');
  }
  if (ready.length){
    html += `<h6 class="sec-title tight">Ready to save · ${ready.length}</h6>`;
    html += ready.map(it => dlRowHtml(it)).join('');
  }
  if (failed.length){
    html += `<h6 class="sec-title tight">Needs attention · ${failed.length}</h6>`;
    html += failed.map(it => dlRowHtml(it)).join('');
  }

  html += `<div class="d-flex align-items-center px-3 pt-4 pb-2">
    <div class="flex-grow-1">
      <div class="fw-bold">Available offline</div>
      <div class="text-secondary" style="font-size:.74rem">${all.length} track${all.length !== 1 ? 's' : ''} · ${fmtSize(totalSize)}</div>
    </div>
    ${all.length ? `<button class="pill-btn danger sm" onclick="clearAllCache()">
      <i class="bi bi-trash3"></i> Clear
    </button>` : ''}
  </div>`;

  if (!all.length && !active.length && !ready.length && !failed.length){
    html += emptyState('download', 'Nothing offline yet', 'Crawl a track, then tap Save.');
  } else if (!all.length){
    html += `<div class="state" style="padding:20px 24px">
      <p style="font-size:.8rem">Nothing saved yet — start a download above.</p>
    </div>`;
  } else {
    html += all.map(e => {
      const m = e.meta || {};
      const art = m.artwork || '';
      const id = String(e.trackId);
      const playing = Player.track && String(Player.track.trackId) === id;
      return `<div class="dl-row">
        <button class="row-play ${playing && Player.playing ? 'playing' : ''}" onclick="playCachedById('${esc(id)}')" aria-label="Play">
          <i class="bi ${playing && Player.playing ? 'bi-pause-fill' : 'bi-play-fill'}"></i>
        </button>
        <a class="row-info" href="#/track/${esc(id)}">
          ${art ? `<img class="row-art" src="${esc(art)}" alt="">`
                : `<div class="row-art row-art-ph"><i class="bi bi-music-note"></i></div>`}
          <div class="min-w-0 flex-grow-1">
            <div class="row-title text-truncate">${esc(m.name || id)}</div>
            <div class="row-sub text-truncate">${esc(m.artist || '')} · ${fmtSize(e.size || 0)}</div>
          </div>
        </a>
        <button class="icon-btn sm text-danger" onclick="removeCached('${esc(id)}')" aria-label="Remove">
          <i class="bi bi-trash3"></i>
        </button>
      </div>`;
    }).join('');
  }

  wrap.innerHTML = html;
}

function dlRowHtml(it){
  const isActive = ['queued','crawling','saving'].includes(it.status);
  const isReady  = it.status === 'ready';
  const isFailed = ['failed','paused'].includes(it.status);

  const statusLabel = {
    queued:'Queued', crawling:'Crawling', saving:'Saving',
    ready:'Ready', failed:'Failed', paused:'Paused'
  }[it.status] || it.status;

  const statusClass = {
    queued:'queued', crawling:'crawling', saving:'saving',
    ready:'ready', failed:'error', paused:'error'
  }[it.status] || 'queued';

  const pct = it.percent || 0;
  const progressClass = isFailed ? 'error' : it.status === 'saving' ? 'saving' : '';

  let rightAction = '';
  if (isActive){
    rightAction = `<button class="icon-btn sm text-danger" onclick="DL.remove('${esc(it.trackId)}')" aria-label="Cancel">
      <i class="bi bi-x-lg"></i>
    </button>`;
  } else if (isReady){
    rightAction = `<button class="pill-btn success sm" onclick="DL.saveNow('${esc(it.trackId)}')">
      <i class="bi bi-download"></i> Save
    </button>
    <button class="icon-btn sm text-danger" onclick="DL.remove('${esc(it.trackId)}')" aria-label="Dismiss">
      <i class="bi bi-x-lg"></i>
    </button>`;
  } else if (isFailed){
    rightAction = `<button class="pill-btn danger sm" onclick="DL.retry('${esc(it.trackId)}')">
      <i class="bi bi-arrow-repeat"></i> Retry
    </button>
    <button class="icon-btn sm" onclick="DL.remove('${esc(it.trackId)}')" aria-label="Dismiss">
      <i class="bi bi-x-lg"></i>
    </button>`;
  }

  const sizeInfo = it.status === 'saving' && it.totalBytes
    ? `${fmtSize(it.bytes)} / ${fmtSize(it.totalBytes)}`
    : '';

  return `<div class="dl-row">
    ${it.artwork
      ? `<img class="row-art" src="${esc(it.artwork)}" alt="">`
      : `<div class="row-art row-art-ph"><i class="bi bi-music-note"></i></div>`}
    <div class="dl-body">
      <div class="d-flex align-items-center gap-2 mb-1">
        <div class="dl-title text-truncate flex-grow-1 min-w-0">${esc(it.name)}</div>
        <span class="dl-status ${statusClass}">${statusLabel}</span>
      </div>
      <div class="dl-sub text-truncate">${esc(it.artist || '')}${sizeInfo ? ' · ' + sizeInfo : ''}</div>
      ${isActive ? `<div class="dl-progress ${progressClass}"><div style="width:${pct}%"></div></div>` : ''}
      ${isFailed && it.error ? `<div class="dl-sub text-danger text-truncate">${esc(it.error)}</div>` : ''}
    </div>
    ${rightAction}
  </div>`;
}

/* ══════════════════════════════════════════════════════════════
   24 · THEME
   ══════════════════════════════════════════════════════════════ */
function applyTheme(){
  const dark = ls.get(KEY.theme, true);
  document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
  const icon = $('#themeIcon');
  if (icon) icon.className = dark ? 'bi bi-moon-stars' : 'bi bi-sun';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = dark ? '#0b0b0d' : '#ffffff';
}
function toggleTheme(){
  ls.set(KEY.theme, !ls.get(KEY.theme, true));
  applyTheme(); haptic(8);
}

/* ══════════════════════════════════════════════════════════════
   25 · GLOBAL EVENTS
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight' && audio.duration) audio.currentTime = Math.min(audio.currentTime + 5, audio.duration);
  if (e.key === 'ArrowLeft'  && audio.duration) audio.currentTime = Math.max(audio.currentTime - 5, 0);
  if (e.key === 'Escape' && $('#full')?.classList.contains('show')) closeFullPlayer();
});
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (a) closeAllSheets();
});

/* ══════════════════════════════════════════════════════════════
   26 · BOOT
   ══════════════════════════════════════════════════════════════ */
(async function boot(){
  applyTheme();

  DL.load();
  resumeDownloadPolling();

  DL.onChange(() => {
    updateDownloadBadges();
    syncSaveButton();

    if (location.hash.startsWith('#/track/')){
      const id = location.hash.split('?')[0].split('/')[2];
      const dl = DL.get(id);
      const it = getCached('track', id);
      if (it && dl) renderCrawlCard(it, null);
    }
    if (location.hash.startsWith('#/library/downloads')){
      updateDlLists();
    }
    if (location.hash.startsWith('#/library') || location.hash.startsWith('#/search') ||
        location.hash.startsWith('#/album')   || location.hash.startsWith('#/artist')){
      refreshLikes();
    }
  });
  updateDownloadBadges();

  try { await refreshCacheIndex(); }
  catch (e){ console.warn('[MusicMan] cache index failed:', e); }

  if (!location.hash) location.replace('#/');
  await route();
  refreshLikes();
})();

window.addEventListener('error', e => console.error('[MusicMan]', e.error || e.message));
</script>
